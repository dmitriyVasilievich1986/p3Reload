<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2342"/>
      <stop offset="60%" stop-color="#051021"/>
      <stop offset="100%" stop-color="#02060d"/>
    </linearGradient>

    <!-- Vibrant Cyan/Blue Gradient for 'P' -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#38f3ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>

    <!-- Deep Blue Gradient for '3' -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0033aa"/>
    </linearGradient>

    <!-- Subtle Glow for Small Render Sizes -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Shape (Rounded Square) -->
  <rect width="128" height="128" rx="28" fill="url(#p3Bg)"/>
  
  <!-- Outer Accent Border -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#00aaff" stroke-width="1.5" opacity="0.4"/>

  <!-- Background Crescent Motif Accent -->
  <path d="M 98,22 A 44,44 0 1,0 110,80 A 36,36 0 1,1 98,22 Z" 
        fill="#0055ff" opacity="0.25"/>

  <!-- Dynamic Slanted Slash Lines (UI Vibe) -->
  <g stroke="#00d2ff" stroke-width="2" opacity="0.35">
    <line x1="15" y1="110" x2="35" y2="18" />
    <line x1="108" y1="110" x2="118" y2="60" stroke-width="1.5" />
  </g>

  <!-- P3 MONOGRAM GROUP -->
  <g filter="url(#iconGlow)">
    <!-- Slanted "P" -->
    <path d="M 28,96 L 42,32 L 68,32 C 82,32 90,39 86,52 C 82,65 71,71 57,71 L 43,71 L 38,96 Z 
             M 50,44 L 47,59 L 58,59 C 64,59 69,56 71,50 C 73,45 70,44 64,44 Z" 
          fill="url(#cyanGrad)"/>

    <!-- Overlapping Slanted "3" -->
    <path d="M 66,96 L 70,78 C 76,82 83,83 89,80 C 95,76 98,69 96,62 C 94,56 88,52 80,54 L 83,42 L 104,42 L 102,51 L 89,51 L 87,58 C 94,56 102,58 106,64 C 110,73 105,86 94,92 C 85,97 74,97 66,96 Z" 
          fill="url(#blueGrad)"/>
  </g>

  <!-- Small Bottom UI Dot Accent -->
  <circle cx="28" cy="104" r="2.5" fill="#38f3ff"/>
</svg>
